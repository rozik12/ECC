<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<title>Tartib</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f1419;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{max-width:420px;text-align:center}
  img{width:72px;height:72px;margin:0 auto 20px;border-radius:18px;display:block}
  h1{font-size:22px;margin:0 0 12px}
  p{margin:0 0 8px;color:#9fb0c0;line-height:1.5;font-size:15px}
  button{margin-top:20px;background:#0f766e;color:#fff;border:0;border-radius:12px;padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<!-- Страница «нет сети». Хранится в service worker, поэтому самодостаточна: без скриптов сайта, стили внутри, три языка сразу. -->
<main class="card">
  <img src="/logo/tartib-mark-512.png" alt="Tartib" width="72" height="72">
  <h1>Нет подключения к интернету</h1>
  <p>Журнал и статистика хранятся на сервере, поэтому без сети они недоступны. Проверь соединение и повтори.</p>
  <p>Internet aloqasi yo'q. Ulanishni tekshirib, qayta urinib ko'ring.</p>
  <p>No internet connection. Check your connection and try again.</p>
  <button id="retry" type="button">Повторить · Qayta urinish · Retry</button>
</main>
<script>document.getElementById("retry").addEventListener("click",function(){location.reload()})</script>
</body>
</html>
